# 로컬 실시간 시세 fan-out 수평확장 검증 전용 오버레이(1단계, "일부러
# 깨뜨리기" → RabbitMQ STOMP relay + 리더락 검증). docker-compose.yml
# 위에 얹어서 쓴다 - mysql/redis/quant-engine/redpanda는 base 파일
# 그대로 재사용하고, 여기서는 새 서비스만 추가한다:
#
#   docker compose -f docker-compose.yml -f docker-compose.scaleout.yml \
#     up -d --build rabbitmq backend-1 backend-2 backend-3 nginx-ws
#
# docker-compose.prod.yml + docker-compose.cloudwatch.yml의 오버레이
# 패턴과 동일(README/DEVELOPMENT.md 참고). 끝나면:
#
#   docker compose -f docker-compose.yml -f docker-compose.scaleout.yml down
#
# (전역 규칙 "로컬 개발 서버 종료 원칙" - 계속 띄워두라는 명시 요청이
# 없는 한 검증 후 반드시 내린다.)
#
# 세 backend는 backend/Dockerfile을 그대로 빌드한다(prod와 동일 이미지,
# 새 Dockerfile 불필요) - 컨테이너 시작 시 환경변수로만 로컬 scale-out
# 토폴로지(mysql/redis/quant-engine/redpanda 컨테이너명, dev 프로필,
# 브로커/리더 관련 신규 플래그)를 오버라이드한다. 시크릿(Toss/OAuth/JWT
# 등)은 backend/.env(gitignore 대상, 로컬 개발용)를 그대로 재사용 -
# `git worktree`로 분리한 디렉터리에서 작업 중이라면 원본 체크아웃의
# backend/.env를 복사해와야 한다(gitignore 파일은 워크트리 간 자동
# 공유되지 않음).
#
# 이 파일에 별도 name:을 주면 안 된다 - compose는 여러 -f 파일을 합칠 때
# "마지막에 나온 name:"을 프로젝트명으로 쓰는데, 여기 별도 이름을 주면
# base 파일(docker-compose.yml, name: quantlime)과 다른 프로젝트로
# 취급돼 mysql/redis/quant-engine/redpanda를 "재사용"하는 게 아니라
# 새로 만들려고 시도한다 - 그런데 그 서비스들의 container_name은 base
# 파일에 이미 고정돼 있어(quantlime-redis 등) 실행 중인 quantlime
# 프로젝트의 컨테이너와 이름이 충돌해 즉시 실패한다(실제로 겪음,
# 2026-09-25). name:을 생략해야 base 파일의 quantlime 프로젝트에
# 그대로 합류한다.

services:
  # STOMP 플러그인만 얹은 RabbitMQ - 브라우저가 붙는 rabbitmq_web_stomp이
  # 아니라, Spring 서버가 브로커에 TCP로 붙는 일반 rabbitmq_stomp(기본
  # 61613)이 필요하다(RabbitStompRelayConfig 참고). management 플러그인은
  # 이미지에 기본 포함 - 육안 디버깅용(구독 큐 확인 등)으로만 host에 연다.
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: quantlime-scaleout-rabbitmq
    command: bash -c "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"
    ports:
      - "15672:15672"
    # 다른 서비스와 동일한 보수적 시작값 - docker stats 실측 후 조정
    # (docker-compose.yml의 기존 서비스 관례 그대로).
    deploy:
      resources:
        limits:
          memory: 400M
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend-1:
    build: ./backend
    container_name: quantlime-scaleout-backend-1
    env_file: backend/.env
    environment: &backend_scaleout_env
      SPRING_PROFILES_ACTIVE: dev
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHON_ENGINE_URL: http://quant-engine:8000
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # 아래 3개는 검증 Run 1~3마다 여기 값만 바꿔 재기동한다(README/
      # SRE.md §5 검증 절차 참고) - 이미지 재빌드 불필요.
      WEBSOCKET_BROKER_RELAY_ENABLED: "false"
      RABBITMQ_STOMP_HOST: rabbitmq
      PRICE_FEED_MODE: synthetic
    depends_on:
      mysql:
        condition: service_healthy
      # redis는 base 파일(docker-compose.yml)에 healthcheck가 없다(mysql/
      # quant-engine/redpanda와 다름) - service_healthy를 쓰면 "no
      # healthcheck configured"로 즉시 실패한다(실제로 겪음, 2026-09-25).
      redis:
        condition: service_started
      quant-engine:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: on-failure:5
    # JVM 3개가 새로 뜨는 만큼 prod(1g)보다 조금 낮춰 시작 - 실측 후 조정.
    deploy:
      resources:
        limits:
          memory: 700M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend-2:
    build: ./backend
    container_name: quantlime-scaleout-backend-2
    env_file: backend/.env
    environment: *backend_scaleout_env
    depends_on:
      mysql:
        condition: service_healthy
      # redis는 base 파일(docker-compose.yml)에 healthcheck가 없다(mysql/
      # quant-engine/redpanda와 다름) - service_healthy를 쓰면 "no
      # healthcheck configured"로 즉시 실패한다(실제로 겪음, 2026-09-25).
      redis:
        condition: service_started
      quant-engine:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 700M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend-3:
    build: ./backend
    container_name: quantlime-scaleout-backend-3
    env_file: backend/.env
    environment: *backend_scaleout_env
    depends_on:
      mysql:
        condition: service_healthy
      # redis는 base 파일(docker-compose.yml)에 healthcheck가 없다(mysql/
      # quant-engine/redpanda와 다름) - service_healthy를 쓰면 "no
      # healthcheck configured"로 즉시 실패한다(실제로 겪음, 2026-09-25).
      redis:
        condition: service_started
      quant-engine:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 700M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # backend-1/2/3 앞의 순수 로드밸런서(정적 파일 없음, frontend/nginx.conf와
  # 다른 목적 - nginx/scaleout.conf 참고). 기본 라운드로빈(ip_hash 없음)이라
  # WS 커넥션마다 다른 인스턴스로 분산된다 - "문제 A 재현"의 핵심 조건.
  nginx-ws:
    image: nginx:1.27-alpine
    container_name: quantlime-scaleout-nginx-ws
    volumes:
      - ./nginx/scaleout.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:80"
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 64M
