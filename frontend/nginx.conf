# 단일 EC2 배포용: 정적 프론트 서빙 + 백엔드(REST/WebSocket) 리버스 프록시.
# 프론트가 same-origin(/api, /ws)으로만 요청하므로 브라우저 입장에선
# CORS가 필요 없다(백엔드 CORS 설정은 로컬 개발용 3001 포트 대상 그대로 둠).

# 80번은 ACME 챌린지만 직접 서빙하고 나머지는 전부 443으로 리다이렉트.
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 챌린지 - certbot이 호스트에 쓴 파일을 그대로 서빙
    # (webroot 모드, docker-compose.prod.yml의 바인드 마운트와 짝을 이룸).
    # 갱신도 이 경로로 오므로 80번에서 계속 살려둬야 한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/quantlime.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantlime.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # REST API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SockJS 핸드셰이크 + STOMP WebSocket 업그레이드
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SockJS의 롱폴/XHR 폴백 트랜스포트는 REST 요청보다 오래 걸릴 수
        # 있어 기본 60초 타임아웃을 넉넉히 늘림
        proxy_read_timeout 3600s;
    }

    # 업로드된 이미지 정적 서빙(백엔드 WebConfig의 리소스 핸들러로 프록시 -
    # 여기 빠뜨리면 /uploads/* 요청이 이 파일 맨 아래 SPA catch-all에
    # 걸려 이미지 대신 index.html이 내려간다)
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # SPA 라우팅 폴백(OAuth 콜백 등 클라이언트 라우트 새로고침 대응)
    location / {
        try_files $uri /index.html;
    }
}
