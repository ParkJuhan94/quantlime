# 단일 EC2 배포용: 정적 프론트 서빙 + 백엔드(REST/WebSocket) 리버스 프록시.
# 프론트가 same-origin(/api, /ws)으로만 요청하므로 브라우저 입장에선
# CORS가 필요 없다(백엔드 CORS 설정은 로컬 개발용 3001 포트 대상 그대로 둠).

# IP당 요청 제한(2026-10 개방 준비) - 봇/스캐너 한 마리가 단일 EC2를 잠식하지
# 못하게 하는 최소 방어선. 이 파일이 conf.d/default.conf로 http{} 안에
# include되므로 zone 선언을 server{} 밖에 둘 수 있다. nginx가 직접 인터넷에
# 노출된 구조라 $binary_remote_addr가 실제 클라이언트 IP다 - 앞단에
# CDN/LB(Cloudflare, ALB)를 붙이면 전부 프록시 IP로 보이므로 그때는
# real_ip 모듈(set_real_ip_from + real_ip_header)을 먼저 설정해야 한다.
# 한도는 NAT 뒤 다수 사용자(회사/모바일 망)가 한 IP를 공유하는 경우를 감안해
# 넉넉히 잡았다 - 운영 지표(429 비율)를 보며 조정할 것.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# 80번은 ACME 챌린지만 직접 서빙하고 나머지는 전부 443으로 리다이렉트.
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 챌린지 - certbot이 호스트에 쓴 파일을 그대로 서빙
    # (webroot 모드, docker-compose.prod.yml의 바인드 마운트와 짝을 이룸).
    # 갱신도 이 경로로 오므로 80번에서 계속 살려둬야 한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/quantlime.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantlime.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # 로그인/OAuth/토큰 재발급 - 무차별 대입과 토큰 재발급 폭주를 막기 위해
    # 일반 API보다 훨씬 엄격하게 제한(정상 사용자는 분당 한두 번 수준).
    # nginx는 더 구체적인 prefix 위치를 우선 매칭하므로 /api/ 블록의
    # 프록시 헤더를 그대로 복제한다.
    location /api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx 기본값(1MB)이 자막 수동 임포트(/api/admin/feed/transcripts/import)
        # 배치 요청에 걸려 413을 반환했다(2026-09-15 실측 - 34건 자막 배치가
        # 1.1MB). 백엔드 자체 한도(spring.servlet.multipart, 5MB - 이미지
        # 업로드 전용)와는 별개로 이 위치에서만 넉넉히 올린다.
        client_max_body_size 20m;
    }

    # SockJS 핸드셰이크 + STOMP WebSocket 업그레이드
    location /ws/ {
        # SockJS 폴백은 한 클라이언트가 커넥션을 여럿 쓸 수 있어 넉넉히 20
        limit_conn ws_conn 20;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SockJS의 롱폴/XHR 폴백 트랜스포트는 REST 요청보다 오래 걸릴 수
        # 있어 기본 60초 타임아웃을 넉넉히 늘림
        proxy_read_timeout 3600s;
    }

    # 업로드된 이미지 정적 서빙(백엔드 WebConfig의 리소스 핸들러로 프록시 -
    # 여기 빠뜨리면 /uploads/* 요청이 이 파일 맨 아래 SPA catch-all에
    # 걸려 이미지 대신 index.html이 내려간다)
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # SPA 라우팅 폴백(OAuth 콜백 등 클라이언트 라우트 새로고침 대응)
    location / {
        try_files $uri /index.html;
    }
}
