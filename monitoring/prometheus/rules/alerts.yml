# 알림 규칙. Alertmanager(monitoring/alertmanager/alertmanager.yml)를 거쳐
# Slack #quantlime-alerts(실제 Slack 채널명 그대로 유지)로 전송된다. 임계값은 t3.small~medium 1대 규모의
# 초기 추정치로, 실제 운영 데이터를 보며 조정할 것을 전제로 한다.
groups:
  # --- 가용성: 서비스 자체가 죽었는지 ---
  - name: quantlime-availability
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "QuantLime 백엔드가 다운됨"
          description: "Prometheus가 2분 이상 backend(actuator/prometheus)를 스크랩하지 못했습니다."

      - alert: QuantEngineDown
        expr: up{job="quant-engine"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "퀀트 엔진(quant-engine)이 다운됨"
          description: "Prometheus가 2분 이상 quant-engine을 스크랩하지 못했습니다. 스코어 재계산은 직전 이력으로 fallback되지만 신규 계산은 멈춥니다."

      # backend의 /api/health는 의존성(DB/Redis)을 확인하지 않는 정적
      # 200이라(application.yml 주석 참고), mysqld-exporter/redis-exporter가
      # 직접 보고하는 mysql_up/redis_up 없이는 "DB만 죽은 상태"가 무알림으로
      # 남는다(2026-08-17 감사에서 실제로 발견).
      - alert: MysqlDown
        expr: mysql_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MySQL이 다운됨"
          description: "mysqld-exporter가 2분 이상 MySQL에 연결하지 못하고 있습니다."

      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis가 다운됨"
          description: "redis-exporter가 2분 이상 Redis에 연결하지 못하고 있습니다 - 로그인/재발급/구독 결제 락이 fail-closed로 막힙니다(RefreshTokenStore/RedisLockService/PaymentService 참고)."

      # frontend(nginx)는 별도 /metrics가 없어 cAdvisor가 보는 컨테이너
      # 생존 신호(container_last_seen)로 대체한다 - 전용 exporter 추가 없이
      # 기존 스크랩 대상만으로 커버.
      - alert: FrontendDown
        expr: time() - container_last_seen{name="quantlime-prod-frontend"} > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "frontend(nginx) 컨테이너가 응답하지 않음"
          description: "cAdvisor가 1분 이상 frontend 컨테이너를 보지 못했습니다 - 80포트로 들어오는 모든 요청(정적/API 프록시/WS)이 도달 불가 상태일 수 있습니다."

      # restart: on-failure:5(도커 자체 재시작)와 autoheal(healthcheck 기반
      # 강제 재시작)이 반복적으로 발동하는 상황 - 둘 다 "복구는 됐지만
      # 계속 재발하는" 상태라 개별 alert(BackendDown 등)로는 안 걸릴 수
      # 있다(재시작이 매번 빠르게 성공하면 up==0 구간이 짧아 for 조건을
      # 못 채움).
      - alert: ContainerRestartLoop
        expr: changes(container_start_time_seconds{name=~"quantlime-prod-.+"}[30m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "컨테이너 재시작 루프 감지: {{ $labels.name }}"
          description: "{{ $labels.name }}이(가) 최근 30분간 3회 이상 재시작했습니다 - restart:on-failure 또는 autoheal이 반복 발동 중일 수 있습니다."

  # --- HTTP 지연/에러율 ---
  - name: quantlime-http
    rules:
      - alert: HighHttp5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="backend", outcome="SERVER_ERROR"}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{job="backend"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "백엔드 5xx 응답 비율 5% 초과"
          description: "최근 5분간 HTTP 5xx 응답 비율이 5%를 넘었습니다."

  # --- 이 프로젝트만의 비즈니스 지표: Toss 429, 퀀트엔진 실패율 ---
  # (2026-07-16 세션에서 겪은 Toss MARKET_DATA 429 장애가 이 알림의 계기)
  - name: quantlime-business
    rules:
      - alert: TossRateLimitSpike
        expr: sum(rate(toss_api_calls_total{outcome="rate_limited"}[5m])) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Toss API 429(Rate Limit) 급증"
          description: "최근 5분간 초당 0.5건 이상의 Toss 429 응답이 발생했습니다 - MarketPriceSweepScheduler 청크 딜레이(현재 120ms)를 늘리는 것을 검토하세요."

      - alert: QuantEngineFailureRate
        expr: |
          sum(rate(python_engine_calls_total{outcome="failure"}[15m]))
          /
          sum(rate(python_engine_calls_total[15m]))
          > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "퀀트 엔진 호출 실패율 20% 초과"
          description: "스코어 재계산 호출이 실패해 직전 스코어로 fallback되는 비율이 높습니다(ScoreService/PythonEngineClient)."

  # --- 백업(scripts/backup-mysql.sh·backup-uploads.sh가 node-exporter
  # textfile collector로 직접 기록하는 성공 시각) ---
  - name: quantlime-backup
    rules:
      - alert: MysqlBackupStale
        expr: time() - mysql_backup_last_success_timestamp_seconds > 93600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "MySQL 백업이 26시간 이상 갱신되지 않음"
          description: "매일 03:00 크론(scripts/backup-mysql.sh)이 26시간 이상 성공하지 못했습니다 - 백업 자체가 조용히 실패하고 있을 수 있습니다(set -e라 실패 시 이 메트릭이 갱신되지 않음)."

      - alert: UploadsBackupStale
        expr: time() - uploads_backup_last_success_timestamp_seconds > 93600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "업로드 이미지 백업이 26시간 이상 갱신되지 않음"
          description: "매일 03:15 크론(scripts/backup-uploads.sh)이 26시간 이상 성공하지 못했습니다 - 업로드 이미지는 EBS 볼륨 손실 시 S3 백업이 유일한 복구 수단입니다(2026-09-10 추가, 그 전까지는 실패를 알 수단이 없었음)."

      # 위 두 *Stale 알림은 `time() - <메트릭> > 임계값` 형태라 메트릭이
      # 아예 없으면(한 번도 성공한 적 없음) 빈 벡터가 되어 절대 발화하지
      # 않는다 - 실제로 backup-uploads.sh가 실행 권한이 없어 5일 연속
      # Permission denied로 실패하는 동안 이 사각지대에 걸려 무알림으로
      # 지나갔다(2026-09-10 발견). absent()로 "메트릭 자체가 없다"를 별도로
      # 잡는다. for: 25h는 배치가 하루 1회(24h 주기)라 최초 배포 직후
      # 다음 실행 전까지의 정상적인 부재를 오탐으로 잡지 않기 위한 여유다.
      - alert: MysqlBackupMetricMissing
        expr: absent(mysql_backup_last_success_timestamp_seconds)
        for: 25h
        labels:
          severity: warning
        annotations:
          summary: "MySQL 백업 성공 메트릭이 존재하지 않음"
          description: "mysql_backup_last_success_timestamp_seconds 메트릭 자체가 없습니다 - 크론이 한 번도 성공하지 못했거나(예: 실행 권한 문제), textfile collector 경로 설정이 잘못됐을 수 있습니다. MysqlBackupStale과 달리 이 알림은 '오래됨'이 아니라 '존재하지 않음'을 감지합니다."

      - alert: UploadsBackupMetricMissing
        expr: absent(uploads_backup_last_success_timestamp_seconds)
        for: 25h
        labels:
          severity: warning
        annotations:
          summary: "업로드 이미지 백업 성공 메트릭이 존재하지 않음"
          description: "uploads_backup_last_success_timestamp_seconds 메트릭 자체가 없습니다 - 2026-09-05~09-09 실행 권한 결손으로 실제로 겪은 사각지대(Permission denied가 5일간 무알림으로 지나감)를 재발 방지하기 위해 추가했습니다."

  # --- 서킷브레이커(2026-08-17 도입, resilience4j-micrometer가 노출) ---
  # toss/quant-engine/quant-engine-transcript/upbit/naver-finance 5개 인스턴스만
  # 존재(application.yml resilience4j.circuitbreaker.instances 참고, 2026-09-14
  # fetchTranscript 분리로 quant-engine-transcript 추가). name 라벨 필터가 없어
  # 새 인스턴스가 추가돼도 이 알림이 자동으로 커버한다.
  - name: quantlime-resilience
    rules:
      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "서킷브레이커 OPEN: {{ $labels.name }}"
          description: "{{ $labels.name }} 서킷브레이커가 2분 이상 OPEN 상태입니다 - 해당 외부 클라이언트 호출이 즉시 실패 처리되고 있습니다."

  # --- 리소스: JVM 힙 + 호스트 메모리/디스크 ---
  # 호스트 메모리/디스크 알림은 원래 CloudWatch 커스텀 메트릭+SNS로 별도
  # 구성했었는데, Slack 단일 창으로 통합하기 위해 이 PLG 스택으로
  # 일원화했다(CloudWatch/IAM 인스턴스 역할/SNS 관련 코드는 제거함 -
  # docs/DEPLOYMENT.md 참고).
  - name: quantlime-resource
    rules:
      - alert: JvmHeapHigh
        expr: |
          sum(jvm_memory_used_bytes{job="backend", area="heap"})
          /
          sum(jvm_memory_max_bytes{job="backend", area="heap"})
          > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "백엔드 JVM 힙 사용률 90% 초과"
          description: "GC 압박 또는 메모리 누수 가능성 - 힙 덤프/스레드 덤프 확인을 권장합니다."

      - alert: HostMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "호스트 메모리 사용률 90% 초과"

      - alert: HostDiskHigh
        expr: |
          (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "호스트 루트 디스크 사용률 90% 초과"

  # --- DB/캐시 포화(2026-09 성능 감사 신설) ---
  # mysqld-exporter/redis-exporter는 이미 §가용성에서 up==0만 쓰고 있었고,
  # HikariCP 메트릭(hikaricp_*)은 quantlime-loadtest.json 대시보드에만 패널로
  # 있을 뿐 알람 룰이 0건이었다 - docs/00-sre/SRE.md가 "커넥션 대기
  # (hikaricp_connections_pending)가 1순위 지표"라고 명시해뒀는데도 알람이
  # 없어 사람이 대시보드를 직접 봐야만 알 수 있었다. 이 그룹이 그 공백을
  # 메운다.
  - name: quantlime-saturation
    rules:
      - alert: HikariConnectionPending
        expr: hikaricp_connections_pending{job="backend"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP 커넥션 대기 발생"
          description: "커넥션 풀(기본 10개)이 고갈돼 요청 스레드가 대기 중입니다 - normalizeCrossSection처럼 트랜잭션 안에서 외부 HTTP를 호출하는 경로가 풀을 오래 붙잡고 있을 수 있습니다(docs/00-sre/SRE.md 참고)."

      - alert: HikariPoolNearExhaustion
        expr: |
          hikaricp_connections_active{job="backend"}
          /
          hikaricp_connections_max{job="backend"}
          > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP 커넥션 풀 사용률 90% 초과"
          description: "활성 커넥션이 최대치(hikaricp_connections_max)의 90%를 넘었습니다 - 대기(HikariConnectionPending)로 번지기 전 조기 경보입니다."

      # innodb_buffer_pool_reads(디스크 물리 읽기) / _read_requests(논리 읽기
      # 요청 전체)가 높으면 버퍼풀이 hot dataset을 못 덮고 있다는 뜻이다
      # (운영 버퍼풀 512MB vs 실측 데이터셋 1.1GB+, docker-compose.prod.yml
      # 주석 참고). rate() 비율이라 재시작 직후 카운터 리셋 구간의 노이즈를
      # 피하려 10분 윈도우로 잡았다.
      - alert: MysqlBufferPoolMissRateHigh
        expr: |
          rate(mysql_global_status_innodb_buffer_pool_reads[10m])
          /
          rate(mysql_global_status_innodb_buffer_pool_read_requests[10m])
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "InnoDB 버퍼풀 미스율 5% 초과"
          description: "버퍼풀이 hot dataset을 못 덮어 디스크 물리 읽기 비율이 높습니다 - innodb_buffer_pool_size 상향을 검토하세요(docker-compose.prod.yml 주석의 사이징 근거 참고)."

      - alert: MysqlSlowQueriesRising
        expr: rate(mysql_global_status_slow_queries[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL 슬로우 쿼리 발생률 상승"
          description: "long_query_time(1초) 초과 쿼리가 초당 0.1건 이상 발생 중입니다 - 슬로우 쿼리 로그(2026-09 성능 감사에서 활성화, /var/lib/mysql/slow.log)를 확인하세요."

      # maxmemory 200mb + volatile-lru(docker-compose.yml 주석 참고) 조합이라
      # eviction이 발생하면 곧 시세 스냅샷(PriceCacheStore, TTL 5분)이나
      # 스코어 랭킹 캐시(ScoreRankingCacheStore, TTL 1시간)가 조기 유실된다는
      # 뜻이다 - 캐시 미스 증가로 DB 부하가 그만큼 다시 늘어난다.
      - alert: RedisKeysEvicted
        expr: increase(redis_evicted_keys_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis 키 축출(eviction) 발생"
          description: "최근 10분간 maxmemory 한도로 인한 키 축출이 발생했습니다 - 시세/랭킹 캐시가 TTL보다 먼저 사라져 캐시 미스가 늘어날 수 있습니다."

      - alert: RedisMemoryHigh
        expr: |
          redis_memory_used_bytes
          /
          redis_memory_max_bytes
          > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis 메모리 사용률 80% 초과"
          description: "maxmemory(200mb) 대비 사용률이 80%를 넘었습니다 - RedisKeysEvicted로 번지기 전 조기 경보입니다."
