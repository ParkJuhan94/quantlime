# 로컬/EC2 공통 Prometheus 설정. 스크랩 대상은 전부 docker-compose 내부
# 네트워크의 컨테이너명으로 참조한다(quantlime-prod 프로젝트 기본 네트워크를
# docker-compose.prod.yml과 공유 - docker-compose.monitoring.yml 참고) -
# 호스트 포트 노출 여부와 무관하게 스크랩 가능하다(backend/quant-engine은
# 호스트 포트를 열지 않는 내부 전용 서비스).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot Actuator + Micrometer(backend/api/build.gradle 참고).
  # /actuator/**는 SecurityConfig에서 permitAll이지만 nginx가 프록시하지
  # 않아 외부에서는 도달 불가 - Prometheus만 내부망에서 스크랩한다.
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  # FastAPI + prometheus-fastapi-instrumentator(quant-engine/main.py 참고).
  - job_name: quant-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["quant-engine:8000"]

  # 호스트(EC2) CPU/메모리/디스크/네트워크
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # MySQL/Redis 자체 상태(mysql_up/redis_up) - backend의 /api/health가
  # 의존성을 안 보는 정적 200이라 이전엔 "DB만 죽은 상태"가 무알림으로
  # 남았다(2026-08-17 감사, alerts.yml의 MysqlDown/RedisDown 참고).
  - job_name: mysqld-exporter
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  # 외부 관점 프로브(blackbox) - 실제 도메인으로 HTTPS 요청을 보내 TLS 인증서
  # 만료일과 응답 가능 여부를 본다. 같은 EC2 안에서 도는 프로브라 호스트가
  # 죽으면 같이 죽으므로 "외부 업타임 체크(UptimeRobot 등)"를 대체하지는
  # 못한다 - 인증서 갱신 실패를 조용히 놓치지 않기 위한 것(alerts.yml의
  # TlsCertExpiringSoon 참고).
  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://quantlime.com/api/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
