# Alertmanager는 설정 파일 안에서 환경변수 치환을 지원하지 않는다. 그래서
# 이 파일은 SLACK_ALERT/WARN/INFO_WEBHOOK_URL 자리를 __SLACK_*_WEBHOOK_URL__
# 플레이스홀더로 남긴 "템플릿"으로 커밋하고, docker-compose.monitoring.yml의
# entrypoint가 컨테이너 기동 시점에 sed로 실제 값을 채운 사본
# (/etc/alertmanager/alertmanager.yml)을 만들어 그걸로 alertmanager를
# 띄운다 - 실제 시크릿 값은 여전히 .env.prod(gitignore 대상)에만 존재하고
# git에는 남지 않는다.
#
# 플레이스홀더에 $ 문자를 안 쓴 이유: 만약 ${SLACK_ALERT_WEBHOOK_URL}
# 형태로 뒀다면, docker compose 자신이 이 파일을 마운트하는 volumes 설정이
# 아니라 "compose 파일 텍스트"만 해석 대상으로 삼기 때문에 원래는 이
# 파일 내용과 무관해야 하지만, 실제로는 이 템플릿을 그대로 옮겨 적은
# entrypoint 스크립트 문자열 안에서 compose의 ${VAR} 보간과 충돌해
# 의도한 리터럴 문자열이 아니라 실제 시크릿 값으로 미리 치환돼버리는
# 문제를 실제로 겪었다(로컬 `docker compose config`로 렌더링 결과를
# 직접 확인해 발견). $ 문자가 아예 없는 플레이스홀더를 쓰면 compose
# 보간 대상 자체가 되지 않아 이 충돌이 원천적으로 사라진다.
#
# 여기서 쓰는 웹훅은 기존 SlackWebhookClient(사용자 피드백 전용, slack.
# feedback-webhook-url)와 별개의 ops 알림 채널로 분리 등록할 것을 권장한다
# (docs/DEPLOYMENT.md 참고) - 사용자 피드백과 인프라 알람이 같은 채널에
# 섞이면 노이즈가 커진다.
# 채널 3분할(2026-10-08): 알림 소음이 한 채널에 몰려 정작 봐야 할 critical이 묻혔다.
#   - critical -> #quantlime-critical : Down/OOM/5xx/TLS 등 즉시 봐야 하는 것(재전송 4h)
#   - warning  -> #quantlime-warnings : 지켜볼 것(재전송 12h, resolved 알림 생략)
#   - 그 외(info) -> #quantlime-info : 정보성. 앱이 즉시 보내는 DLT 개별 메시지도 이 채널로 간다
#     (backend application.yml의 slack.ops-webhook-url = SLACK_INFO_WEBHOOK_URL)
# Slack 웹훅 URL은 채널에 묶여 있어 채널마다 웹훅을 따로 발급해야 한다. WARN/INFO 웹훅이 비어 있으면
# docker-compose.monitoring.yml이 SLACK_ALERT_WEBHOOK_URL로 대체해, 채널을 아직 안 만들었어도 기존처럼
# 한 채널로 모두 전송된다(하위 호환).
# 주의: 모든 수신자(critical 포함)에 `channel:`을 지정하지 않는다 - 웹훅이 이미 채널에 묶여 있고, 구형 웹훅은
# `channel`을 덮어쓰기로 취급해 그 채널이 없으면 `channel_not_found`(404)로 거부한다. WARN/INFO 웹훅이 아직
# 없어 SLACK_ALERT_WEBHOOK_URL로 대체된 상태에서도 알림이 유실되지 않으려면 웹훅의 기본 채널로 보내야 한다
# (2026-10-08 배포 직후 `#quantlime-warnings` 미생성 상태에서 실제로 발생). critical 채널도 `#quantlime-alerts`에서
# `#quantlime-critical`로 이름을 바꾸면서 같은 이유로 `channel:`을 제거했다(이름이 바뀐 뒤 옛 이름으로 덮어쓰면 실패).
route:
  receiver: slack-info
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
  routes:
    # 운영 자막 수집(videofeed-transcript)은 YouTube가 AWS 등 클라우드 IP를 차단해(RequestBlocked,
    # 2026-10-08 확인 - 48시간 63건 전부 실패) 영상마다 DLT가 쌓인다. 자막은 로컬에서 가져와 운영에
    # 동기화(scripts/sync-transcripts-to-prod.sh)하는 방식으로 운영하기로 해 이 도메인의 집계 알림은 버린다.
    # (앱의 개별 DLT Slack 메시지 억제는 KafkaDltNotifier 쪽 별도 변경 - 그 전까지는 정보성 채널로만 간다)
    - matchers:
        - alertname="KafkaDltMessageArrived"
        - domain="videofeed-transcript"
      receiver: "null"
    - matchers:
        - severity="critical"
      receiver: slack-critical
      repeat_interval: 4h
    - matchers:
        - severity="warning"
      receiver: slack-warning
      repeat_interval: 12h

receivers:
  - name: "null"
  # 제목 앞 이모지와 막대 색으로 심각도를 한눈에 구분한다(2026-10-08): 🔴 critical(빨강) / 🟠 warning(주황) /
  # 🔵 info(파랑). Slack 채널 이름에는 이모지를 넣을 수 없어 메시지 쪽에서 구분한다. critical만 해결(resolved)
  # 메시지를 보내므로 그때는 ✅ [해결]로 바꾸고 막대를 초록으로 둔다.
  - name: slack-critical
    slack_configs:
      - api_url: "__SLACK_ALERT_WEBHOOK_URL__"
        send_resolved: true
        color: '{{ if eq .Status "resolved" }}good{{ else }}#D32F2F{{ end }}'
        title: '{{ if eq .Status "resolved" }}✅ [해결] {{ else }}🔴 {{ end }}{{ .CommonAnnotations.summary }}'
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
  - name: slack-warning
    slack_configs:
      - api_url: "__SLACK_WARN_WEBHOOK_URL__"
        send_resolved: false
        color: "#F57C00"
        title: "🟠 {{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
  - name: slack-info
    slack_configs:
      - api_url: "__SLACK_INFO_WEBHOOK_URL__"
        send_resolved: false
        color: "#1976D2"
        title: "🔵 {{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
