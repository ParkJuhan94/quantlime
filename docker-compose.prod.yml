# 단일 EC2 배포용 compose. 각 앱 서비스는 build(로컬 검증: `docker compose
# -f docker-compose.prod.yml build`)와 image(EC2에서는 `pull`로 GHCR 이미지
# 사용, `docker-compose.prod.yml pull && up -d`)를 함께 명시해 한 파일로
# 로컬 빌드 검증과 EC2 배포를 모두 지원한다.
#
# 토폴로지 고정값(호스트명·포트 등 서비스 간 배선)은 여기 environment에,
# 실제 비밀값(시크릿)은 .env.prod(gitignore 대상, .env.prod.example 참고)로
# 분리한다.
#
# 프로젝트명을 dev용 docker-compose.yml과 다르게 고정(quantlime-prod)해
# 컨테이너명·볼륨명이 겹치지 않게 한다 - 두 compose 파일이 같은 루트
# 디렉터리에 있어 이름을 명시하지 않으면 둘 다 기본 프로젝트명(디렉터리명
# "quantlime")을 공유해, 로컬에서 prod 스택을 검증차 띄우면 dev용
# MySQL/Redis 컨테이너와 볼륨을 그대로 재사용(사실상 덮어씀)해버린다.
name: quantlime-prod

services:
  mysql:
    image: mysql:8.0
    container_name: quantlime-prod-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quantlime}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: on-failure:5
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+09:00

  redis:
    image: redis:7-alpine
    container_name: quantlime-prod-redis
    volumes:
      - redis_data:/data
    restart: on-failure:5
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  quant-engine:
    build: ./quant-engine
    image: ghcr.io/parkjuhan94/quantlime-quant-engine:latest
    container_name: quantlime-prod-quant-engine
    env_file: .env.prod
    restart: on-failure:5
    healthcheck:
      # curl/wget이 없는 python:3.11-slim 베이스라 표준 라이브러리로 대체
      # (직접 pull해 실측 확인 - Dockerfile에 패키지를 추가하지 않고도
      # 기존 이미지 그대로 헬스체크 가능)
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build: ./backend
    image: ghcr.io/parkjuhan94/quantlime-backend:latest
    container_name: quantlime-prod-backend
    env_file: .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHON_ENGINE_URL: http://quant-engine:8000
      # 업로드 이미지 저장 경로(FileStorageService) - 컨테이너 내부 절대
      # 경로라 시크릿이 아닌 토폴로지 값. 아래 volumes:의 upload_data와
      # 반드시 같은 경로를 가리켜야 한다(안 그러면 컨테이너 재기동 시
      # 업로드 파일이 유실된다).
      UPLOAD_DIR: /app/uploads
    volumes:
      - upload_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      quant-engine:
        condition: service_healthy
    restart: on-failure:5
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Spring Boot 컨텍스트(JPA/스케줄러/WebSocket 등) 부팅까지 여유
      # 있게 - 너무 짧으면 정상 기동 중에도 unhealthy로 오탐돼 autoheal이
      # 부팅 중인 컨테이너를 죽이는 역효과가 남
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # same-origin 프록시(nginx.conf)라 빈 값 - axios/STOMP가 상대경로로
        # 요청하게 됨. OAuth 클라이언트 ID는 공개값이라 .env.prod에서 가져옴
        VITE_API_BASE_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_KAKAO_CLIENT_ID: ${VITE_KAKAO_CLIENT_ID}
        VITE_NAVER_CLIENT_ID: ${VITE_NAVER_CLIENT_ID}
    image: ghcr.io/parkjuhan94/quantlime-frontend:latest
    container_name: quantlime-prod-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: on-failure:5
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # restart: on-failure:5는 컨테이너의 메인 프로세스가 "종료"돼야만
  # 발동한다 - 프로세스는 살아있는데 응답만 안 하는 hang 상태(예: JVM이
  # 데드락에 걸렸지만 프로세스 자체는 안 죽는 경우)는 on-failure로 잡히지
  # 않는다. autoheal이 각 서비스의 healthcheck 결과(unhealthy)를 감시하다가
  # 그런 컨테이너를 강제로 재시작시켜 이 사각지대를 메운다 - 즉
  # on-failure(프로세스 종료 감지)와 healthcheck+autoheal(응답 없음 감지)은
  # 서로 다른 장애 유형을 잡는 보완 관계.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: quantlime-prod-autoheal
    restart: always
    environment:
      # 개별 서비스마다 label을 붙이는 대신 healthcheck가 정의된 컨테이너를
      # 전부 감시 - 새 서비스를 추가할 때 autoheal 설정을 따로 안 건드려도
      # 헬스체크만 정의하면 자동으로 감시 대상에 포함된다
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mysql_data:
  redis_data:
  upload_data:
