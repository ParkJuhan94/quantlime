# 관측성 스택 오버레이(Phase 1: 메트릭 + 대시보드 + Slack 알림). 로그/
# 메트릭/알림 전체를 CloudWatch가 아닌 이 스택(PLG류: Prometheus/
# Grafana + Alertmanager)으로 일원화했다 - AWS 자격증명이 전혀 필요 없어
# 로컬에서도 그대로 기동·검증할 수 있다:
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml \
#     --env-file .env.prod up -d --build
#
# docker-compose.prod.yml과 별도 파일로 분리한 이유: 관측성 스택은
# 선택적 구성요소라 항상 켤 필요는 없고, 필요할 때만 -f로 얹는 편이 base
# 파일을 단순하게 유지한다. name을 여기서 다시 선언하지 않아도
# docker-compose.prod.yml의 `name: quantlime-prod`를 그대로 따라가 같은
# 프로젝트/네트워크에 합류한다.
#
# 로그(Loki+Alloy)는 2026-10-08에 추가했고(로그 검색 + 로그 기반 알림), 트레이스(Tempo)는
# Phase 3로 별도 진행 예정이다.
#
# docker-compose.prod.yml에도 동일한 x-logging 앵커가 있는데, docker compose는
# -f로 병합하는 각 파일을 독립적으로 파싱한 뒤 병합하므로 YAML 앵커가 파일
# 경계를 넘어 공유되지 않는다 - 이 파일에서도 다시 정의해야 한다(2026-08-17).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: quantlime-prod-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # 규칙 파일은 볼륨 마운트라 배포 시 컨테이너 안에는 이미 반영되지만,
      # 이 플래그가 없으면 그 변경을 읽어들일 방법이 HTTP 리로드가 아니라
      # 컨테이너 재시작뿐이었다(2026-09-10 - UploadsBackupStale 알림 추가
      # 배포 때 실제로 겪음, docs/00-sre/SRE.md "백업" 절 참고). 9090이
      # 인바운드 방화벽으로 막혀 있어(SSH 터널로만 접근) 이 API를 외부에
      # 노출하는 위험은 없다.
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    restart: on-failure:5
    mem_limit: 512m
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: quantlime-prod-alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template:ro
      - alertmanager_data:/alertmanager
    environment:
      # critical 채널(기존). WARN/INFO가 비어 있으면 이 값으로 대체돼 한 채널로 모두 전송된다(하위 호환)
      SLACK_ALERT_WEBHOOK_URL: ${SLACK_ALERT_WEBHOOK_URL:-}
      SLACK_WARN_WEBHOOK_URL: ${SLACK_WARN_WEBHOOK_URL:-${SLACK_ALERT_WEBHOOK_URL:-}}
      SLACK_INFO_WEBHOOK_URL: ${SLACK_INFO_WEBHOOK_URL:-${SLACK_ALERT_WEBHOOK_URL:-}}
    # Alertmanager 설정 파일은 환경변수 치환을 지원하지 않아(monitoring/
    # alertmanager/alertmanager.yml 상단 주석 참고) 기동 시 sed로 직접
    # 치환한 사본을 만든 뒤 그 파일로 기동한다. prom/alertmanager 이미지는
    # busybox 베이스라 sh/sed를 그대로 쓸 수 있다. 치환 대상 플레이스홀더
    # (__SLACK_ALERT_WEBHOOK_URL__)에는 $ 문자가 없어 docker compose 자신의
    # ${VAR} 보간과 충돌하지 않는다 - $ 문자가 있는 쪽은 오직 아래 sed
    # 치환식의 우변($$SLACK_ALERT_WEBHOOK_URL, compose가 $$를 리터럴 $ 하나로
    # 풀어줘서 컨테이너 안 sh가 실행 시점에 environment의 실제 값으로
    # 확장한다)뿐이다.
    entrypoint:
      - sh
      - -c
      - |
        sed -e "s#__SLACK_ALERT_WEBHOOK_URL__#$$SLACK_ALERT_WEBHOOK_URL#" \
            -e "s#__SLACK_WARN_WEBHOOK_URL__#$$SLACK_WARN_WEBHOOK_URL#" \
            -e "s#__SLACK_INFO_WEBHOOK_URL__#$$SLACK_INFO_WEBHOOK_URL#" \
          /etc/alertmanager/alertmanager.yml.template > /etc/alertmanager/alertmanager.yml
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    ports:
      - "9093:9093"
    restart: on-failure:5
    mem_limit: 128m
    logging: *default-logging

  # 호스트(EC2) CPU/메모리/디스크/네트워크 - node_memory_*/node_filesystem_*
  # 등을 Prometheus가 스크랩(monitoring/prometheus/rules/alerts.yml의
  # HostMemoryHigh/HostDiskHigh가 참조). textfile collector 디렉터리는
  # scripts/backup-mysql.sh가 백업 성공 시각을 기록하는 곳과 같은 경로 -
  # MySQL 자체엔 백업 성공/실패를 노출할 방법이 없어 크론 스크립트가 직접
  # 메트릭 파일을 쓰는 게 유일한 방법이다(MysqlBackupStale 알림, 2026-08-17).
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: quantlime-prod-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./monitoring/textfile-collector:/textfile-collector:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.textfile.directory=/textfile-collector
    restart: on-failure:5
    mem_limit: 64m
    logging: *default-logging

  # cAdvisor는 2026-10-04에 제거했다 - 운영 EC2의 Docker 29(containerd 이미지 스토어)에서
  # cAdvisor v0.49.1이 Docker 컨테이너를 하나도 등록하지 못해(`failed to identify the
  # read-write layer ID`) container_* 지표에 name 라벨이 없었고, 그 지표에 의존하던
  # FrontendDown/RedpandaDown/ContainerRestartLoop 알림이 조용히 죽어 있었다. 컨테이너별
  # 메모리/CPU/생존/기동 시각은 호스트 크론 scripts/report-container-metrics.sh가
  # node-exporter textfile collector로 내보내는 quantlime_container_* 지표가 대신한다.
  # (기존 서버에는 `docker compose ... up -d --remove-orphans`로 남은 컨테이너를 정리할 것)

  # MySQL 자체 상태(mysql_up)를 Prometheus가 직접 볼 수 있게 한다 - 이전엔
  # backend의 /api/health가 의존성을 안 보는 정적 200이라(application.yml
  # 주석 참고) "MySQL만 죽은 상태"가 무알림으로 남았다(2026-08-17 감사).
  #
  # DATA_SOURCE_NAME 환경변수가 아니라 --config.my-cnf를 쓴다(2026-09-24
  # 수정) - v0.15.1부터 DATA_SOURCE_NAME 지원 자체가 제거됐다(자격증명이
  # `docker inspect`/`ps`로 평문 노출되는 걸 막기 위한 upstream의 의도적
  # breaking change, `docker run --rm prom/mysqld-exporter:v0.15.1 --help`로
  # 실측 확인 - --mysqld.password 플래그가 아예 없고 .my.cnf만 지원). 즉 이
  # 컨테이너는 그동안 계속 기동 직후 크래시루프에 빠져 MysqlDown 알림이
  # 무알림으로 방치됐을 가능성이 있다 - docker-compose.monitoring.local.yml로
  # 로컬 알림 연습 스택을 만들다가 동일 증상을 실측 재현해 발견했다
  # (docs/DEVELOPMENT.md §3 참고). 비밀번호를 담은 .my.cnf는 파일로
  # 커밋하지 않고 entrypoint가 기동 시점에 환경변수로부터 생성한다.
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: quantlime-prod-mysqld-exporter
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    # 비밀번호를 백틱으로 감싸는 이유: .my.cnf 파서(mysqld_exporter가 쓰는 ini 파서)는 값 중간의 `#`을
    # 주석 시작으로 보고 그 뒤를 잘라낸다. 비밀번호에 `#`이 있으면 잘린 값으로 접속해 `Access denied`
    # (mysql_up=0, MysqlDown 상시 발화 - 2026-09-25~10-08 운영에서 발생, 임시 MySQL 컨테이너로 재현).
    # 큰따옴표/작은따옴표/백슬래시 이스케이프는 이 파서에서 효과가 없었고 백틱만 통했다. 비밀번호에
    # 백틱 자체가 들어 있으면 이 방식도 깨지니 그 경우엔 모니터링 전용 DB 사용자를 만들 것.
    entrypoint:
      - sh
      - -c
      - |
        printf '[client]\nuser=root\npassword=`%s`\n' "$$DB_PASSWORD" > /tmp/.my.cnf
        exec /bin/mysqld_exporter --config.my-cnf=/tmp/.my.cnf --mysqld.address=mysql:3306
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure:5
    mem_limit: 64m
    logging: *default-logging

  # 실제 도메인 HTTPS 프로브(TLS 인증서 만료일 + 응답 여부) - prometheus.yml의
  # blackbox-https job이 이 컨테이너를 경유해 대상 URL을 호출한다.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: quantlime-prod-blackbox-exporter
    restart: on-failure:5
    mem_limit: 32m
    logging: *default-logging

  # Redis 자체 상태(redis_up)도 동일한 이유로 직접 스크랩한다.
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: quantlime-prod-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure:5
    mem_limit: 64m
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.1
    container_name: quantlime-prod-grafana
    # 대시보드 JSON은 monitoring/grafana/provisioning/dashboards/json에
    # 직접 두고 provisioning 트리 하나만 통째로 마운트한다 - 처음에는
    # 대시보드 JSON 폴더를 provisioning과 별개 경로(monitoring/grafana/
    # dashboards)에 두고 별도 bind mount로 그 안쪽 경로에 다시 마운트했는데,
    # 바깥쪽 provisioning 마운트가 :ro(읽기전용)라 컨테이너가 그 안에
    # 마운트포인트 디렉터리를 새로 만들 수 없어 "read-only file system"
    # 에러로 기동 자체가 실패했다(로컬 실제 기동 중 발견) - 마운트를
    # 하나로 합쳐 중첩 마운트 자체를 없애 해결.
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # 로컬 개발 환경의 다른 프로젝트 Grafana(3000)/QuantLime 프론트(3001)와
      # 포트가 겹치지 않도록 3002로 매핑.
      - "3002:3000"
    depends_on:
      - prometheus
    restart: always
    mem_limit: 256m
    logging: *default-logging

  # 로그 저장·검색·로그 기반 알림(2026-10-08 도입). 앱 컨테이너 로그를 Alloy가 모아 여기로 보내고
  # Grafana(Explore)에서 LogQL로 검색한다. 하루 로그가 수 MB 수준(backend 시간당 약 4,800줄)이라
  # 메모리 한도는 384m로 시작한다(실측 전 추정치 - 배치 구간 `한도 대비 사용률`을 보고 조정).
  # 보관 14일(loki.yml)이라 디스크는 압축 기준 수십 MB 수준으로 예상(서버 여유 5.4G, 2026-10-08).
  # 로그 알림 규칙은 monitoring/loki/rules/fake/*.yml(ruler가 Alertmanager로 전달).
  loki:
    image: grafana/loki:3.5.0
    container_name: quantlime-prod-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - ./monitoring/loki/rules:/etc/loki/rules:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: on-failure:5
    mem_limit: 384m
    logging: *default-logging

  # 컨테이너 로그 수집기(Grafana Alloy). Promtail은 2026-03 지원 종료라 후속인 Alloy를 쓴다.
  # 도커 소켓(읽기 전용 마운트여도 API는 전부 호출 가능하다는 점에 유의 - autoheal과 같은 수준의 권한)으로
  # 컨테이너를 찾아 로그를 읽는다. 이미지가 약 700MB로 크다(서버 디스크 여유 5.4G 기준 부담).
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: quantlime-prod-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    restart: on-failure:5
    mem_limit: 192m
    logging: *default-logging

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  alloy_data:
