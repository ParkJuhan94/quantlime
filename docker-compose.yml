# 로컬 dev 인프라. 명시적 name:을 지정해 compose 프로젝트명이 디렉터리명에서
# 암묵적으로 파생되지 않게 한다 - 디렉터리명이 나중에 바뀌어도(예: quantlab
# → quantlime 리네이밍) 볼륨명이 조용히 갈라지지 않도록 하기 위함.
name: quantlime

services:
  mysql:
    image: mysql:8.0
    container_name: quantlime-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-quantlime}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quantlime}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+09:00
      --server-id=1
      --gtid-mode=ON
      --enforce-gtid-consistency=ON

  redis:
    image: redis:7-alpine
    container_name: quantlime-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # maxmemory/maxmemory-policy 미지정 시 기본 noeviction이라, 캐시
    # 활용도를 높이면 컨테이너 메모리 한도에서 OOM-kill되거나 쓰기가
    # 실패한다(2026-08-19 감사). volatile-lru는 TTL이 있는 키(캐시+
    # 토큰/락 전부)만 축출 대상으로 삼는다 - eviction 정책은 Redis
    # 인스턴스 전체에 적용되고 DB 인덱스로는 격리되지 않아, 캐시 키만
    # 축출 대상으로 좁히려면 별도 컨테이너가 필요하다(이번엔 비용 대비
    # 과함으로 판단해 채택 안 함). TTL 없는 키가 새로 생기면 그건 절대
    # 축출되지 않는 안전망으로만 동작한다.
    command: redis-server --maxmemory 200mb --maxmemory-policy volatile-lru

  # 로컬 dev 전용 구성 - 기존 Dockerfile로 의존성만 이미지에 굽고, 소스는
  # 볼륨 마운트로 덮어써서 --reload 핫리로드를 유지한다(코드 수정마다
  # 재빌드할 필요 없음). requirements.txt를 바꾼 경우에만
  # `docker compose build quant-engine`으로 재빌드 필요 - 이미지 빌드
  # 시점에 pip install된 site-packages는 /app 밖에 있어 볼륨 마운트로도
  # 안 사라진다. 백엔드가 quant-engine보다 먼저 뜨면 스코어 재계산이
  # 전부 연결실패로 스킵되는 문제(2026-07-25 실측)가 있어, 여기 넣어두면
  # `docker compose up -d` 한 번으로 항상 같이 뜨게 할 수 있다.
  quant-engine:
    build:
      context: ./quant-engine
    container_name: quantlime-quant-engine
    ports:
      - "8000:8000"
    volumes:
      - ./quant-engine:/app
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mysql_data:
  redis_data:
