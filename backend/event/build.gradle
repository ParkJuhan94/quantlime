plugins {
    // @Component/@RetryableTopic 대상 클래스는 Kotlin에서 기본 final이라 Spring
    // 프록시가 불가능하다 - kotlin-spring(allopen)이 스프링 어노테이션 클래스를 open으로 만든다.
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.spring'
}

dependencies {
    implementation project(':core')
    // KafkaDltNotifier가 SlackWebhookClient를 직접 쓴다(slack이 core 밖 모듈로 분리돼 core를 통해선 안 보임)
    implementation project(':slack')

    // kotlin-reflect가 있어야 Spring이 Kotlin nullable 파라미터(String?)를
    // optional로 인식한다(DLT 핸들러의 exceptionMessage 헤더).
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'

    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 영상 피드 파이프라인 이벤트화(2026-09-14) - Kafka Producer/Consumer는
    // 이 모듈이 전담한다(모듈 표 "event: Kafka Producer/Consumer, 이벤트 설정" 참고).
    implementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'

    // DLT 관측(2026-09-24) - @DltHandler에서 실패 카운터를 직접 등록한다
    // (core의 PythonEngineClient 등과 동일한 MeterRegistry 직접 사용 패턴).
    implementation 'io.micrometer:micrometer-core'
}
