dependencies {
    implementation project(':core')
    implementation project(':event')
    implementation project(':common')
    // GlobalExceptionHandler가 ExternalApiException을 직접 잡고,
    // SubscriptionControllerTest가 TossPaymentsApiClient를 직접 @MockBean
    // 한다 - core를 통한 전이 의존을 기대하지 않고(implementation은
    // 비전이적) 각자 직접 선언한다(2026-09-28, 토스페이먼츠 모듈 분리)
    implementation project(':client-support')
    implementation project(':tosspayments')
    testImplementation(testFixtures(project(':core')))

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // RabbitStompRelayConfig(websocket.broker.relay-enabled=true일 때만
    // 실제로 쓰임)의 enableStompBrokerRelay가 런타임에 브로커로 TCP 연결을
    // 맺는 데 필요 - Spring 공식 문서가 명시하는 필수 의존성. 컴파일 타임엔
    // enableStompBrokerRelay 자체가 spring-websocket API라 이 의존성이
    // 없어도 컴파일되지만, 플래그를 켠 순간 런타임에서 클래스를 못 찾아
    // 터진다. flag가 false(기본값)인 환경에서는 그냥 안 쓰일 뿐이라 상시
    // 포함해도 안전(2026-09-25).
    implementation 'io.projectreactor.netty:reactor-netty'
    implementation 'io.netty:netty-all'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Hibernate 자체 SQL 로거(show-sql)는 파라미터가 ?로 남고 실행시간이
    // 안 찍혀 datasource-proxy로 대체(파라미터 바인딩 + 실행시간 포함
    // 완성형 SQL). 1.12.1이 Spring Boot 3.x 호환 버전(README 호환표 기준).
    implementation 'com.github.gavlyukovskiy:datasource-proxy-spring-boot-starter:1.12.1'

    runtimeOnly 'me.paulschwarz:spring-dotenv:4.0.0'
}

tasks.named('bootJar') { enabled = true }
tasks.named('jar') { enabled = true }
