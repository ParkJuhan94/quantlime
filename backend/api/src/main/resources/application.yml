spring:
  application:
    name: quantlime
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3308}/${MYSQL_DATABASE:quantlime}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:quantlime}
  jpa:
    # SQL 로깅은 datasource-proxy(decorator.datasource, 파일 하단)가
    # 전담한다 - Hibernate 자체 SQL 로거(show-sql/format_sql/
    # use_sql_comments)는 파라미터가 ?로 남고 실행시간이 안 찍혀 대체함.
    open-in-view: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

# Prometheus가 스크랩할 /actuator/prometheus만 열고 나머지 actuator
# 엔드포인트는 닫아둔다(공격 표면 최소화). health는 DB/Redis 등 실제
# 의존성을 확인하는 상세 지표라 기존 /api/health(정적 200, cron 헬스체크
# 스크립트 전용)와 별개로 둔다 - 서로 다른 소비자(운영 스크립트 vs
# Prometheus/사람)를 겨냥해 의도적으로 분리 유지. loggers는 재시작 없이
# 로그 레벨을 토글하기 위해 추가 - /actuator/**는 nginx가 프록시하지
# 않아 외부에서 도달 불가하므로(SecurityConfig 주석 참고) 노출해도 안전.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # http.server.requests에만 퍼센타일 히스토그램을 켜서 Grafana에서
      # p95/p99 지연 패널을 그릴 수 있게 한다(histogram_quantile 사용).
      # toss.api.duration/python-engine.duration 등 커스텀 Timer는 태그
      # 카디널리티가 낮고 평균 지연만으로 충분해 굳이 버킷을 늘리지 않는다.
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:3001}
  cookie:
    # 리프레시 토큰 쿠키의 Secure 속성. HTTPS가 아니면 브라우저가 secure
    # 쿠키를 아예 저장하지 않으므로, TLS 미적용 상태인 로컬 개발과 현재
    # 프로덕션(순수 HTTP, docs/DEPLOYMENT.md 참고)에서는 반드시 false여야
    # 한다. HTTPS 적용 후 COOKIE_SECURE=true로 전환할 것.
    secure: ${COOKIE_SECURE:false}

toss:
  client-id: ${TOSS_CLIENT_ID:}
  client-secret: ${TOSS_CLIENT_SECRET:}
  base-url: ${TOSS_BASE_URL:https://openapi.tossinvest.com}

# 토스증권 Open API(toss:, 시세/캔들 조회)와는 완전히 별개 제품/인증체계 -
# 시크릿키로 매 요청 Basic Auth(TossPaymentsConfig), 토큰 발급/캐싱 불필요.
# 사업자등록 전에는 테스트 키만 쓸 수 있고, 라이브 전환 시 이 값만 교체하면 된다(§4).
toss-payments:
  client-key: ${TOSS_PAYMENTS_CLIENT_KEY:}
  secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
  webhook-secret: ${TOSS_PAYMENTS_WEBHOOK_SECRET:}
  base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
  # 웹훅 시크릿이 비었을 때 서명 검증을 건너뛸지 - 로컬 개발 편의용으로만
  # true. prod(application-prod.yml)에서는 false로 덮어써 fail-closed로 만든다.
  allow-missing-webhook-secret: ${TOSS_PAYMENTS_ALLOW_MISSING_WEBHOOK_SECRET:true}

subscription:
  # 빌링키(자동결제 권한 대표 토큰) 컬럼 암호화 키(base64 32바이트, AES-GCM).
  # 미설정 시 평문 저장(로컬 개발 전용) - BillingKeyConverter 참고.
  billing-key-encryption-key: ${SUBSCRIPTION_BILLING_KEY_ENCRYPTION_KEY:}

# 해외 전종목 마스터파일(.mst.cod.zip) 다운로드 전용(2026-07-29 - 시세 조회는
# Toss로 전량 이관, 인증 불필요한 정적 파일 CDN이라 앱키/시크릿 없음).
kis:
  master-file-base-url: ${KIS_MASTER_FILE_BASE_URL:https://new.real.download.dws.co.kr}

kind:
  base-url: ${KIND_BASE_URL:https://kind.krx.co.kr}

upbit:
  base-url: ${UPBIT_BASE_URL:https://api.upbit.com}

# 텔레그램 채널 공개 웹 미리보기 스크래핑(Phase 8 P7) - Bot API가 아니라
# t.me/s/<핸들> 정적 페이지라 인증 불필요. User-Agent가 없으면 마크업이
# 달라질 수 있어 명시적으로 지정한다(docs/ROADMAP.md "Phase 8 P7" 참고).
telegram:
  base-url: ${TELEGRAM_PREVIEW_BASE_URL:https://t.me}
  user-agent: ${TELEGRAM_USER_AGENT:Mozilla/5.0 (compatible; QuantLimeBot/1.0; +https://quantlime.com)}
  request-delay-ms: ${TELEGRAM_REQUEST_DELAY_MS:1200}

naver-finance:
  base-url: ${NAVER_FINANCE_BASE_URL:https://m.stock.naver.com}
  chart-base-url: ${NAVER_FINANCE_CHART_BASE_URL:https://api.stock.naver.com}

tradingview:
  base-url: ${TRADINGVIEW_BASE_URL:https://scanner.tradingview.com}

# 투자 콘텐츠 요약 피드 모듈(유튜브 채널 수집) - Data API v3, search.list는
# 일 쿼터(10,000u)를 순식간에 소모해 절대 쓰지 않고 playlistItems/videos만
# 사용한다(1u씩).
youtube:
  api-key: ${YOUTUBE_API_KEY:}
  base-url: ${YOUTUBE_BASE_URL:https://www.googleapis.com/youtube/v3}

upload:
  dir: ${UPLOAD_DIR:./uploads}
  max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:5242880}
  public-base-url: ${UPLOAD_PUBLIC_BASE_URL:http://localhost:8080}

slack:
  # 사이드패널 "의견 보내기" 기능이 전송할 Incoming Webhook URL. 비어
  # 있으면 SlackWebhookClient가 조용히 실패하지 않고 명시적으로
  # WEBHOOK_NOT_CONFIGURED 에러를 던진다(설정 누락과 실제 전송 실패를
  # 구분하기 위함).
  feedback-webhook-url: ${SLACK_FEEDBACK_WEBHOOK_URL:}

python-engine:
  base-url: ${PYTHON_ENGINE_URL:http://localhost:8000}

realtime-price:
  poll-interval-ms: ${REALTIME_PRICE_POLL_INTERVAL_MS:3000}

market-ranking:
  poll-interval-ms: ${MARKET_RANKING_POLL_INTERVAL_MS:100}

jwt:
  secret: ${JWT_SECRET:}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:1800000}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:1209600000}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me

# 파라미터 바인딩까지 채워진 완성형 SQL + 실행시간을 찍어준다(Hibernate
# 자체 show-sql은 ?만 남고 시간이 안 나와 대체, §jpa 주석 참고). 리스너를
# 항상 등록만 해두고(enable-logging) 실제 출력 여부는 아래 logging.level의
# SLF4JQueryLoggingListener 레벨로 제어한다 - warn이면 조용하고, 필요할 때
# /actuator/loggers로 debug 토글하면 그 순간부터 찍힌다.
decorator:
  datasource:
    datasource-proxy:
      logging: slf4j
      multiline: true
      query:
        enable-logging: true
        log-level: debug
        logger-name: net.ttddyy.dsproxy.listener.logging.SLF4JQueryLoggingListener

# 상시 debug는 MarketPriceSweepScheduler(100ms 폴링)가 초당 수백 건의
# SQL을 찍어 IntelliJ 콘솔이 버벅이게 만든다 - 특정 쿼리를 봐야 할 땐
# 재시작 없이 /actuator/loggers로 그때만 켤 것.
logging:
  level:
    root: info
    com.quantlime: info
    net.ttddyy.dsproxy.listener.logging.SLF4JQueryLoggingListener: warn

---
# 로컬 단일 인스턴스 개발 전용 콘솔 포맷 - Spring Boot 기본 패턴(풀 ISO
# 타임스탬프+PID+앱이름+"---"+스레드명+로거명)은 다중 인스턴스/로그 수집기
# 환경(prod)을 전제로 한 정보량이라 로컬에서는 매 줄이 불필요하게 길다.
# 날짜(오늘 뻔함)·PID·앱이름·구분자를 빼고 시:분:초+레벨+스레드명(스케줄러
# vs 웹요청 스레드 구분용)+로거명만 남긴다. prod는 이 문서가 적용되지
# 않으므로(on-profile: dev) 기본 패턴 그대로 유지된다.
spring:
  config:
    activate:
      on-profile: dev
logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{40}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
  # IntelliJ 콘솔은 재시작하면 사라지고, 새벽 3시 영상 정리·16:00 배치처럼
  # 사람이 안 보고 있을 때 도는 스케줄러 실패는 콘솔만으로 사후 확인이
  # 불가능하다 - 콘솔과 별개로 파일에도 남겨 재시작 후에도 grep 가능하게
  # 한다. logging.file.name을 주면 Spring Boot 기본 logback 설정이 FILE
  # 어펜더를 자동 추가한다(별도 logback-spring.xml 불필요).
  file:
    name: logs/quantlime.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
      total-size-cap: 200MB
