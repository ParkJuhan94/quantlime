# 프로덕션 프로파일 - 베이스 application.yml의 env 치환값은 그대로 쓰고,
# 로컬 개발 편의용으로 켜뒀던 SQL 로깅만 끈다.
#
# ddl-auto는 update를 그대로 유지한다 - 마이그레이션 도구(Flyway 등)를
# 아직 도입하지 않은 상태에서 최초 배포 시 스키마를 자동 생성해야 하고,
# 이후 컬럼 추가 같은 단순 변경도 그대로 반영되는 게 현재로선 더
# 실용적이라는 의도적 트레이드오프. 운영 데이터가 쌓이기 시작하면
# Flyway/Liquibase 도입을 재검토할 것.
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

# 운영에서는 웹훅 시크릿이 비면 서명 없는 웹훅을 전부 거부(fail-closed).
# 베이스 application.yml의 dev 편의용 true를 여기서 명시적으로 덮어쓴다.
toss-payments:
  allow-missing-webhook-secret: false

# 운영 자막 수집은 YouTube가 AWS 등 클라우드 IP를 차단(RequestBlocked, 2026-10-08 확인 - 48시간 63건
# 전부 실패)해 영상마다 DLT가 쌓인다. 자막은 로컬에서 가져와 운영에 동기화(scripts/
# sync-transcripts-to-prod.sh)하는 방식으로 운영하므로 이 도메인의 개별 Slack 알림만 끈다
# (Prometheus 카운터는 그대로 증가 - Alertmanager가 집계 알림을 판단).
kafka:
  dlt:
    slack-suppressed-domains: videofeed-transcript

# 위 이유로 운영의 자체 자막 수집은 한 번도 성공하지 못해(2026-10-23 최근 15시간 /transcribe 11건 전부 500) 영상마다
# 4번 재시도 후 DLT로 가고 엔진 스레드·서킷브레이커만 소모한다. 자막은 로컬 동기화(TranscriptImportService)로만 채우므로
# 운영에서는 자체 수집을 끈다 - 영상은 SELECTED/FAILED 상태로 동기화를 기다린다. 프록시 등으로 운영 IP 차단이 풀리면
# true로 되돌린다(.env.prod가 아니라 이 파일에 고정한 이유: 환경변수가 비면 기본값(true)으로 조용히 돌아가 버려서).
videofeed:
  transcript:
    fetch-enabled: false

logging:
  level:
    root: info
    com.quantlime: info
    org.hibernate.SQL: warn

# 운영에서는 API 명세/Swagger UI를 기본으로 끈다 - SecurityConfig가 두 경로를 permitAll로 열어두므로
# 켜져 있으면 누구나 전체 API 명세를 볼 수 있다. 필요할 때만 서버의 .env.prod에 SPRINGDOC_ENABLED=true를
# 넣고, nginx는 /swagger-ui·/v3/api-docs를 프록시하지 않으니 SSH 터널(호스트 127.0.0.1:8080)로만 접근한다
# (docs/00-sre/DEPLOYMENT.md "운영 Swagger 접근" 참고).
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
