dependencies {
    implementation project(':common')
    implementation project(':client-support')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    // @CircuitBreaker/@Bulkhead/@RateLimiter 애너테이션
    implementation 'io.github.resilience4j:resilience4j-annotations'
    // 호출 지표(Timer/Counter) 계측
    implementation 'io.micrometer:micrometer-core'
    // GeminiDailyQuotaGate가 Redis 카운터로 일일 쿼터를 센다
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
}
