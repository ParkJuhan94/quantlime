plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.6' apply false
    id 'io.spring.dependency-management' version '1.1.7'
    // Kotlin은 event 모듈에만 적용한다(2026-10-01, PaymentWebhookConsumer 전환).
    // 버전은 Spring Boot 3.3.6 BOM이 관리하는 Kotlin 1.9.25에 맞춘다.
    id 'org.jetbrains.kotlin.jvm' version '1.9.25' apply false
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25' apply false
    id 'com.diffplug.spotless' version '7.0.2' apply false
    id 'net.ltgt.errorprone' version '4.1.0' apply false
}

allprojects {
    group = 'com.quantlime'
    version = '0.0.1-SNAPSHOT'

    java {
        sourceCompatibility = '21'
    }

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'net.ltgt.errorprone'
    // 정식 포맷터(palantir/google-aosp)는 실측 결과 647개 중 560~595개 파일이 바뀌어
    // 기존 스타일과 안 맞아 쓰지 않는다. 위생 항목만(169개 파일, 약 700줄)
    spotless {
        java {
            // QueryDSL이 src/main/generated에 만드는 Q클래스는 compileJava의 산출물이라 제외
            target fileTree('.') {
                include 'src/**/*.java'
                exclude '**/generated/**'
            }
            removeUnusedImports()
            importOrder()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    // client-support도 common과 동일하게 java-library로만 둔다(2026-09-28,
    // 토스페이먼츠 모듈 분리) - HttpClientFactorySupport/ExternalApiInvoker/
    // ExternalApiException처럼 여러 모듈이 직접 참조하는 순수 유틸 성격이라,
    // Spring Boot 자동구성/bootJar가 필요 없다.
    if (project.name != 'common' && project.name != 'client-support') {
        apply plugin: 'org.springframework.boot'
        apply plugin: 'java-test-fixtures'

        tasks.named('bootJar') { enabled = false }
        tasks.named('jar') { enabled = true }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.6"
            mavenBom "org.testcontainers:testcontainers-bom:1.21.4"
            // 서킷브레이커/벌크헤드(core 모듈, 2026-08-17 도입) - Spring Boot 3.x
            // 대응 버전
            mavenBom "io.github.resilience4j:resilience4j-bom:2.2.0"
        }
    }

    dependencies {
        errorprone 'com.google.errorprone:error_prone_core:2.36.0'
        errorprone 'com.uber.nullaway:nullaway:0.12.3'
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.testcontainers:testcontainers'
        testImplementation 'org.testcontainers:junit-jupiter'
        testImplementation 'org.testcontainers:mysql'
    }

    tasks.withType(JavaCompile).configureEach {
        // 테스트 소스는 제외 - 프로덕션 코드의 버그 패턴만 본다
        if (name.toLowerCase().contains('test')) {
            options.errorprone.enabled = false
        } else {
            options.errorprone {
                disableWarningsInGeneratedCode = true
                excludedPaths = '.*/build/generated/.*'
                check('NullAway', net.ltgt.gradle.errorprone.CheckSeverity.WARN)
                option('NullAway:AnnotatedPackages', 'com.quantlime')
            }
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
        // Gradle 테스트 JVM의 기본 힙은 512MB다. 통합 테스트는 @MockBean 조합마다 Spring 컨텍스트를
        // 새로 띄워 JVM에 캐시하는데, 테스트가 늘면서 CI에서 컨텍스트 생성 중 OutOfMemoryError가
        // 간헐적으로 났다(2026-10-02, #82 PR 실행과 main 실행에서 WatchlistControllerTest 컨텍스트 로딩 실패).
        // 로컬(./gradlew)과 GitHub Actions가 같은 설정을 읽는다. 컨텍스트가 계속 쌓이는 구조 자체는
        // 그대로라 이건 여유를 늘리는 것이고, 또 부족해지면 컨텍스트 수를 줄이는 쪽을 먼저 검토할 것.
        maxHeapSize = '1g'
        finalizedBy tasks.named('jacocoTestReport')
    }

    // 커버리지는 Codecov가 모듈별 XML을 합쳐 PR에 리포트한다(2026-09-30 도입,
    // 게이트 없이 관측만) - HTML은 로컬 확인용으로만 켠다
    tasks.named('jacocoTestReport') {
        reports {
            xml.required = true
            html.required = true
        }
        // 운영 코드의 테스트 정도와 무관한 클래스는 리포트에서 뺀다(2026-10-02) - 이걸 넣으면 수치가
        // 실제보다 낮게 나와 공백을 가린다. 제외 대상:
        //  - QueryDSL이 만드는 Q클래스(src/main/generated, gitignore 대상 생성물, 라인 710개에 커버율 11%)
        //  - DevController(@Profile("dev") 로컬 전용이라 운영에는 존재하지 않음)
        // 생성물 디렉터리는 신규 clone에서 설정 시점에 아직 없어서 Ant 경로 대신 실행 시점에 평가되는
        // 필터를 쓴다. Q[대문자]로 시작하는 정상 클래스는 현재 없고(QuantLimeApplication은 두 번째 글자가 소문자),
        // 생기면 이 정규식이 걸러내니 클래스명을 Q+대문자로 시작하지 말 것.
        classDirectories.setFrom(files(classDirectories.files.collect { dir ->
            fileTree(dir).matching {
                exclude '**/common/controller/DevController*.class'
                exclude { details -> details.file.name ==~ /Q[A-Z][\w$]*\.class/ }
            }
        }))
    }
}
