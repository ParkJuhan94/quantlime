dependencies {
    implementation project(':common')
    // HttpClientFactorySupport/ExternalApiInvoker/ExternalApiException은
    // 2026-09-28부로 client-support 모듈로 분리됐다(패키지명은 그대로
    // com.quantlime.common.*이라 이 모듈의 다른 파일들은 import 변경이
    // 필요 없다 - common 모듈의 ErrorCode와 동일한 split-package 패턴)
    implementation project(':client-support')
    // 토스페이먼츠(결제) 연동 - 2026-09-28 별도 모듈로 분리(패키지명은
    // com.quantlime.infra.tosspayments.*로 동일하게 유지)
    implementation project(':tosspayments')
    // 외부 연동 클라이언트 모듈 분리(2026-10-04 dart/kis/tradingview 파일럿 후 나머지 클라이언트) - 패키지명은
    // com.quantlime.infra.<이름>.*로 동일하게 유지, core→infra 한 방향 의존만 허용
    implementation project(':dart')
    implementation project(':kis')
    implementation project(':tradingview')
    implementation project(':upbit')
    implementation project(':slack')
    implementation project(':telegram')
    implementation project(':youtube')
    implementation project(':naver')
    implementation project(':python')
    implementation project(':firebase')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // Toss/퀀트엔진 호출 스케줄러 등 core 모듈 빈에서 커스텀 Micrometer
    // 지표(Timer/Counter)를 계측하기 위함 - registry 구현체(prometheus)는
    // api 모듈에서만 붙이고 core는 계측 API(MeterRegistry)만 참조한다.
    implementation 'io.micrometer:micrometer-core'
    // SimpMessagingTemplate만 필요 - WebSocket 핸드셰이크/STOMP 엔드포인트
    // 등록(spring-websocket)은 api 모듈의 WebSocketConfig가 담당한다.
    implementation 'org.springframework:spring-messaging'

    runtimeOnly 'com.mysql:mysql-connector-j'

    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // KIND(kind.krx.co.kr) 상장법인목록은 JSON이 아닌 HTML 테이블로 응답한다
    implementation 'org.jsoup:jsoup:1.18.1'

    // 서킷브레이커/벌크헤드(2026-08-17, 장애 격리 강화) - toss/quant-engine/
    // upbit/naver-finance 4개 핵심 외부 클라이언트에 우선 적용. AOP 프록시
    // 기반이라 spring-boot-starter-aop이 별도로 필요하다(이전엔 AOP 의존성이
    // 전무했음).
    implementation 'io.github.resilience4j:resilience4j-spring-boot3'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    // 서킷브레이커/벌크헤드 상태를 MeterRegistry(→ /actuator/prometheus →
    // Grafana)로 자동 노출하기 위함 - 없으면 CircuitBreakerMetricsAutoConfiguration이
    // 등록되지 않는다.
    implementation 'io.github.resilience4j:resilience4j-micrometer'

    // FCM 웹 푸시 발송(알림 기능, 2026-09) - 같은 리포지토리 HandsUp
    // 프로젝트에서 이미 검증된 버전을 그대로 재사용.
    implementation 'com.google.firebase:firebase-admin:9.2.0'

    testFixturesImplementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testFixturesImplementation 'org.testcontainers:testcontainers'
    testFixturesImplementation 'org.testcontainers:junit-jupiter'
    testFixturesImplementation 'org.testcontainers:mysql'
    testFixturesImplementation 'org.testcontainers:redpanda'
    testFixturesCompileOnly 'org.projectlombok:lombok'
    testFixturesAnnotationProcessor 'org.projectlombok:lombok'

    // 레이어 참조 방향 규칙을 테스트로 고정(2026-09-28, payment 패키지부터
    // 우선 적용 - PaymentLayerArchitectureTest 참고). 프로젝트 전체에는 아직
    // 적용하지 않는다 - 다른 도메인은 서비스 간 상호 참조 등 기존 위반이
    // 많아 그대로 걸면 대거 실패한다.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

def generated = 'src/main/generated'

tasks.withType(JavaCompile).configureEach {
    if (name == 'compileJava') {
        options.getGeneratedSourceOutputDirectory().set(file(generated))
    }
}

sourceSets {
    main.java.srcDirs += [generated]
}

clean {
    delete file(generated)
}
