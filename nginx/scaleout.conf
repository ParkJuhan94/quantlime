# 로컬 scale-out 검증 전용 리버스 프록시(docker-compose.scaleout.yml
# nginx-ws 서비스). 운영 frontend/nginx.conf(TLS, SPA 정적서빙 겸용)와는
# 목적이 다르다 - 여기는 backend 3대 앞에서 WS 팬아웃 정합성을 재현하기
# 위한 순수 로드밸런서 하나뿐, 정적 파일은 안 다룬다(프론트는 이 검증
# 범위 밖 - k6가 직접 붙는다).
#
# upstream이 기본(라운드로빈, ip_hash 없음)인 게 의도적이다 - "문제 A
# 재현"(세션이 붙은 인스턴스만 브로드캐스트를 받는 SimpleBroker의 결함)을
# 보려면 커넥션마다 다른 인스턴스로 분산돼야 한다. sticky 라우팅(ip_hash)은
# relay 도입 후 "정합성이 아니라 재연결 효율" 목적으로만 의미가 있어
# 이번 1단계 범위 밖 - 필요해지면 upstream 블록에 `ip_hash;` 한 줄만
# 추가하면 된다.
upstream backend_pool {
    server backend-1:8080;
    server backend-2:8080;
    server backend-3:8080;
}

server {
    listen 80;

    location /ws/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SockJS 롱폴/XHR 폴백 트랜스포트 대비(frontend/nginx.conf와 동일 이유)
        proxy_read_timeout 3600s;
    }

    # 디버깅용(curl로 개별 인스턴스 응답 확인 등) - REST 부하테스트는
    # 이번 검증 범위 밖(k6 REST 시나리오는 기존처럼 단일 인스턴스를 직접 겨냥).
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /actuator/health {
        proxy_pass http://backend_pool;
    }
}
