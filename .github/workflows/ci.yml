name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # TestContainerSupport가 MySQL·Redis 둘 다 Testcontainers로 격리한다
    # (2026-07-13 - 이전엔 Redis만 서비스 컨테이너로 6381에 매핑해 썼으나,
    # 실제로 로컬/CI Redis를 참조하는 테스트가 ApiTestSupport 계열뿐이라
    # 컨테이너화 후엔 불필요해짐 - CLAUDE.md 참고). 러너가 기본 제공하는
    # Docker로 별도 설정 없이 동작한다.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 + 테스트
        working-directory: backend
        run: ./gradlew build

      # 모듈별 jacoco XML을 Codecov가 합쳐 PR에 코멘트한다. 포크 PR처럼 시크릿이
      # 없는 경우에도 CI가 깨지지 않게 fail_ci_if_error는 끈다
      - name: 커버리지 업로드
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/*/build/reports/jacoco/test/jacocoTestReport.xml
          flags: backend
          fail_ci_if_error: false

  quant-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        working-directory: quant-engine
        run: pip install -r requirements.txt

      # ruff는 런타임 의존성이 아니라 requirements.txt(Docker 이미지에 설치됨)에 넣지
      # 않고 CI에서 버전을 고정해 설치한다
      - name: 린트 + 포맷 검사 (ruff)
        working-directory: quant-engine
        run: |
          pip install ruff==0.16.9
          ruff check .
          ruff format --check .

      # pytest-cov도 ruff와 같은 이유로 CI에서만 설치한다(런타임 의존성 아님)
      - name: 테스트
        working-directory: quant-engine
        run: |
          pip install pytest-cov==6.0.0
          pytest --cov=. --cov-report=xml

      - name: 커버리지 업로드
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: quant-engine/coverage.xml
          flags: quant-engine
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: 포맷 검사 (Prettier)
        working-directory: frontend
        run: npm run format:check

      - name: 타입체크 + 빌드
        working-directory: frontend
        run: npm run build

  # 알림 규칙은 "울려야 할 때 안 울리는" 실패가 조용해서 코드와 같이 CI에서 검증한다(2026-10-01).
  # promtool은 docker-compose.monitoring.yml과 같은 prom/prometheus 이미지에 들어 있다.
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 알림 규칙 문법 검사 (promtool check rules)
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/monitoring/prometheus:/p:ro"
          prom/prometheus:v2.55.1 check rules /p/rules/alerts.yml

      - name: 알림 규칙 단위 테스트 (promtool test rules)
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/monitoring/prometheus:/p:ro"
          prom/prometheus:v2.55.1 test rules /p/tests/alerts_test.yml
