name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # TestContainerSupport가 MySQL·Redis 둘 다 Testcontainers로 격리한다
    # (2026-07-13 - 이전엔 Redis만 서비스 컨테이너로 6381에 매핑해 썼으나,
    # 실제로 로컬/CI Redis를 참조하는 테스트가 ApiTestSupport 계열뿐이라
    # 컨테이너화 후엔 불필요해짐 - CLAUDE.md 참고). 러너가 기본 제공하는
    # Docker로 별도 설정 없이 동작한다.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 + 테스트
        working-directory: backend
        # 모듈 간 병렬 실행 - 모듈 테스트가 직렬로 돌던 걸 겹쳐 실측 6m59s → 5m10s(2026-10-10)
        # 경고 요약 스텝이 읽을 수 있게 로그를 파일로도 남긴다(pipefail로 빌드 실패는 그대로 전파)
        run: |
          set -o pipefail
          ./gradlew build --parallel --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/backend-build.log"

      # NullAway/Error Prone 경고를 실행 화면 상단 요약표와 PR 변경 파일의 해당 줄에 보여준다.
      # 경고가 있어도 실패시키지 않는다(보기 위한 스텝)
      - name: 경고 요약
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/warning_report.py javac backend-build.log "backend (NullAway · Error Prone)" --root "$GITHUB_WORKSPACE"

      # 모듈별 jacoco XML을 Codecov가 합쳐 PR에 코멘트한다. 포크 PR처럼 시크릿이
      # 없는 경우에도 CI가 깨지지 않게 fail_ci_if_error는 끈다
      - name: 커버리지 업로드
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/*/build/reports/jacoco/test/jacocoTestReport.xml
          flags: backend
          fail_ci_if_error: false

      # 느린 테스트 클래스·컨텍스트 기동 횟수를 사후에 분석할 수 있게 XML 결과를 보관한다
      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/*/build/test-results/test/*.xml
          retention-days: 7

  # backend 이미지가 실제로 빌드되는지만 확인한다(푸시 없음). 새 Gradle 모듈을 추가하고 Dockerfile의
  # COPY를 빠뜨리면 Gradle 빌드는 통과하는데 CD의 이미지 빌드에서야 실패했다(PR #75). 별도 잡이라
  # backend 잡과 병렬로 돌아 전체 CI 시간은 늘지 않는다
  docker-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: backend 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

  quant-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        working-directory: quant-engine
        run: pip install -r requirements.txt

      # ruff는 런타임 의존성이 아니라 requirements.txt(Docker 이미지에 설치됨)에 넣지
      # 않고 CI에서 버전을 고정해 설치한다
      - name: 린트 + 포맷 검사 (ruff)
        working-directory: quant-engine
        run: |
          pip install ruff==0.16.9
          ruff check .
          ruff format --check .

      # pytest-cov도 ruff와 같은 이유로 CI에서만 설치한다(런타임 의존성 아님)
      - name: 테스트
        working-directory: quant-engine
        run: |
          pip install pytest-cov==6.0.0
          pytest --cov=. --cov-report=xml

      - name: 커버리지 업로드
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: quant-engine/coverage.xml
          flags: quant-engine
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: |
          set -o pipefail
          npm run lint -- --format unix 2>&1 | tee "$GITHUB_WORKSPACE/frontend-lint.log"

      - name: 경고 요약
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/warning_report.py oxlint frontend-lint.log "frontend (oxlint)"

      - name: 포맷 검사 (Prettier)
        working-directory: frontend
        run: npm run format:check

      - name: 단위 테스트 + 커버리지
        working-directory: frontend
        run: npm run test:coverage

      - name: 커버리지 업로드
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend-utils
          fail_ci_if_error: false

      - name: 타입체크 + 빌드
        working-directory: frontend
        run: npm run build

  # 알림 규칙은 "울려야 할 때 안 울리는" 실패가 조용해서 코드와 같이 CI에서 검증한다(2026-10-01).
  # promtool은 docker-compose.monitoring.yml과 같은 prom/prometheus 이미지에 들어 있다.
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 알림 규칙 문법 검사 (promtool check rules)
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/monitoring/prometheus:/p:ro"
          prom/prometheus:v2.55.1 check rules /p/rules/alerts.yml

      - name: 알림 규칙 단위 테스트 (promtool test rules)
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/monitoring/prometheus:/p:ro"
          prom/prometheus:v2.55.1 test rules /p/tests/alerts_test.yml
